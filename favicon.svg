<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1721" />
      <stop offset="100%" stop-color="#02090f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#e5a100" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e5a100" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e2c3d" stroke-width="2" />
  <!-- Accent Inner Glow Ring -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="none" stroke="#e5a100" stroke-opacity="0.18" stroke-width="1.5" />
  <!-- Monogram FP -->
  <g filter="url(#glow)">
    <!-- Letter F -->
    <path d="M42 36 H74 V48 H56 V60 H70 V72 H56 V92 H42 Z" fill="url(#goldGrad)" />
    <!-- Letter P Accent Bar -->
    <path d="M78 48 C85 48 90 52 90 60 C90 68 85 72 78 72 H74 V84 H88 C98 84 104 76 104 60 C104 44 96 36 82 36 H78 V48 Z" fill="#ffffff" fill-opacity="0.92" />
  </g>
</svg>
